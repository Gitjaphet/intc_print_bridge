name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dépendances
        run: pip install -r requirements-windows.txt

      - name: PyInstaller (service + interface)
        run: |
          pyinstaller --noconfirm --onedir --name INTCBridgeService --hidden-import win32timezone bridge_service.py
          pyinstaller --noconfirm --onedir --windowed --uac-admin --name INTCBridge bridge_gui.py

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:APP_VERSION = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: INTC-Bridge-Setup
          path: Output/*.exe

      - name: Publier dans Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
